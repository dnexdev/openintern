name: Ingest

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run ingest against the current state but publish nothing (rehearsal)"
        type: boolean
        default: false

# State lives in the vars.OPENINTERN_STATE_REPO git repository as flat files
# (companies.jsonl, jobs.jsonl, last_seen.tsv, runs.jsonl). The ingest job
# never sees a write credential: it uploads the new state as an artifact, and
# publish-state (no third-party code, deploy key in a protected environment)
# gates it and pushes it.

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.ingest.outputs.digest }}
      state_base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out current state (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.OPENINTERN_STATE_REPO }}
          path: state-current
          persist-credentials: false
          # Only needed if the state repo is private: a read-only deploy key.
          ssh-key: ${{ secrets.STATE_READ_KEY }}
      - name: Record the state commit this run starts from
        id: base
        run: echo "sha=$(git -C state-current rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build -o "$RUNNER_TEMP/openintern" ./cmd/openintern
      - name: Run ingest
        id: ingest
        env:
          OPENINTERN_SHADOW_HONEST: "1"
          OPENINTERN_DIGEST_PATH: ${{ runner.temp }}/ingest-digest.md
        run: |
          state="$RUNNER_TEMP/state"
          mkdir -p "$state"
          cp state-current/*.jsonl state-current/*.tsv "$state/"
          "$RUNNER_TEMP/openintern" ingest "$state"
          if [ -s "$OPENINTERN_DIGEST_PATH" ]; then echo "digest=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload new state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: state-${{ github.run_id }}
          path: ${{ runner.temp }}/state/
          retention-days: 30
          if-no-files-found: error
      - name: Upload digest
        if: steps.ingest.outputs.digest == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ingest-digest
          path: ${{ runner.temp }}/ingest-digest.md
          retention-days: 7

  # Holds the only write credential for the state repo and runs no third-party
  # code: the gate is built from this repository's own checkout (standard
  # library only, no module downloads), git pushes. Refuses if the state moved
  # since the ingest job read it. The binary is not taken from the ingest job,
  # which talks to job boards and so must not be able to hand this job code.
  publish-state:
    needs: ingest
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: state-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/openintern" ./cmd/openintern
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: state-${{ github.run_id }}
          path: state-new
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.OPENINTERN_STATE_REPO }}
          path: state-repo
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
      - name: Refuse if the state changed during the run
        env:
          BASE: ${{ needs.ingest.outputs.state_base }}
        run: |
          head=$(git -C state-repo rev-parse HEAD)
          if [ "$head" != "$BASE" ]; then
            echo "::error::state repo moved from $BASE to $head during this run; not publishing."
            exit 1
          fi
      - name: Gate
        run: '"$RUNNER_TEMP/openintern" state-gate state-repo state-new'
      - name: Push
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp state-new/*.jsonl state-new/*.tsv state-repo/
          cd state-repo
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="openintern-ingest" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ingest $(date -u +%F)" -m "$RUN_URL"
          git push origin HEAD

  # One open issue collects auto-disables and suspected blocks for a person to
  # confirm; each run with something new adds a comment.
  digest:
    needs: ingest
    if: needs.ingest.outputs.digest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ingest-digest
          path: digest
      - shell: bash
        run: |
          gh label create ingest-digest --color FBCA04 --force
          body="$(cat digest/ingest-digest.md)

          Run: $RUN_URL"
          n=$(gh issue list --state open --label ingest-digest --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "Ingest needs a look" --body "$body" \
              --label ingest-digest --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

  # Separate job so the token that can open issues never sits next to the
  # state deploy key. Assigning the owner makes GitHub Mobile push the alert.
  notify:
    needs: [ingest, publish-state]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - shell: bash
        run: |
          gh label create ingest-failure --color B60205 --force
          body="Daily ingest failed on ${GITHUB_SHA::7} (attempt $GITHUB_RUN_ATTEMPT): $RUN_URL

          Common causes: the state repo could not be read (vars.OPENINTERN_STATE_REPO, STATE_READ_KEY), every company fetch failed, the state repo moved during the run, or the state gate refused the new state."
          n=$(gh issue list --state open --label ingest-failure --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
            gh issue edit "$n" --add-assignee "$GITHUB_REPOSITORY_OWNER"
          else
            gh issue create --title "Ingest failed ($(date -u +%F))" --body "$body" \
              --label ingest-failure --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
