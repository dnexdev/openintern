name: Ingest

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (Citadel CDN bypass)
        run: pnpm exec playwright install --with-deps chromium
      - name: Materialize Tesla state dump (optional secret)
        env:
          TESLA_STATE_JSON: ${{ secrets.TESLA_STATE_JSON }}
        run: |
          if [ -n "$TESLA_STATE_JSON" ]; then
            mkdir -p dumps
            printf '%s' "$TESLA_STATE_JSON" > dumps/tesla-state.json
            echo "OPENINTERN_TESLA_STATE_PATH=$GITHUB_WORKSPACE/dumps/tesla-state.json" >> "$GITHUB_ENV"
          fi
      - name: Require DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets and variables → Actions (Neon connection string)."
            exit 1
          fi
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Run ingest
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENINTERN_BROWSER: "1"
        run: pnpm ingest

  # Separate job so the token that can open issues never sits next to
  # DATABASE_URL. Assigning the owner makes GitHub Mobile push the alert.
  notify:
    needs: ingest
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - shell: bash
        run: |
          gh label create ingest-failure --color B60205 --force
          body="Daily ingest failed on ${GITHUB_SHA::7} (attempt $GITHUB_RUN_ATTEMPT): $RUN_URL

          Common causes: Neon unreachable or over quota, missing DATABASE_URL, or every company fetch failed."
          n=$(gh issue list --state open --label ingest-failure --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
            gh issue edit "$n" --add-assignee "$GITHUB_REPOSITORY_OWNER"
          else
            gh issue create --title "Ingest failed ($(date -u +%F))" --body "$body" \
              --label ingest-failure --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
