name: Dump

# Runs after each successful daily ingest. Two jobs:
#   build   reads the published state (vars.OPENINTERN_STATE_REPO) and writes
#           the dump files; it can write nothing.
#   publish holds release-write permission and runs no third-party code: it
#           builds the gate from this repository's own checkout, checks the
#           build's files with it (openintern dump-gate) and uploads with gh.
on:
  workflow_run:
    workflows: [Ingest]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dump
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out published state (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.OPENINTERN_STATE_REPO }}
          path: state
          persist-credentials: false
          ssh-key: ${{ secrets.STATE_READ_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build -o "$RUNNER_TEMP/openintern" ./cmd/openintern
      - name: Export dumps
        env:
          OPENINTERN_APPLY_HOSTS: ${{ vars.OPENINTERN_APPLY_HOSTS }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dumps"
          "$RUNNER_TEMP/openintern" dump "$GITHUB_WORKSPACE/state" "$GITHUB_WORKSPACE/dumps"
          ls -la "$GITHUB_WORKSPACE/dumps"
          test -s "$GITHUB_WORKSPACE/dumps/MANIFEST.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openintern-dump-${{ github.run_id }}
          path: dumps/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: limit it to main in Settings → Environments.
    environment: dump-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The gate is built here from the checkout (standard library only, no
      # module downloads), never taken from the build job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/openintern" ./cmd/openintern
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openintern-dump-${{ github.run_id }}
          path: new
      - name: Fetch the current release for comparison
        run: gh release download dump-latest --pattern jobs.json --dir prev || echo "no previous dump"
      - name: Gate (integrity, allowlist, delistings, circuit breaker)
        env:
          OPENINTERN_APPLY_HOSTS: ${{ vars.OPENINTERN_APPLY_HOSTS }}
        run: '"$RUNNER_TEMP/openintern" dump-gate new prev'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: new/*
      - name: Update dump-latest in place (stable URLs)
        run: |
          gh release view dump-latest >/dev/null 2>&1 || \
            gh release create dump-latest --title "Latest daily dump" --notes "Updated daily. See DATA.md." --latest
          gh release upload dump-latest new/* --clobber
      - name: Dated snapshot (prerelease, kept 30 days)
        run: |
          tag="dump-$(date -u +%F)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" new/* --clobber
          else
            gh release create "$tag" new/* --prerelease --latest=false \
              --title "Dump $(date -u +%F)" --notes "Daily snapshot. Deleted after 30 days so takedowns take effect; see DATA.md."
          fi
      - name: Prune snapshots older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +%F)
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^dump-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | while read -r tag; do
            if [[ "${tag#dump-}" < "$cutoff" ]]; then gh release delete "$tag" --yes --cleanup-tag; fi
          done

  notify:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - shell: bash
        run: |
          gh label create dump-failure --color B60205 --force
          body="Daily dump failed on ${GITHUB_SHA::7}: $RUN_URL (the site keeps serving the previous dump-latest)."
          n=$(gh issue list --state open --label dump-failure --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
            gh issue edit "$n" --add-assignee "$GITHUB_REPOSITORY_OWNER"
          else
            gh issue create --title "Dump failed ($(date -u +%F))" --body "$body" \
              --label dump-failure --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
