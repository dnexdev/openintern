name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Bend proof gate: LAWS.bend must be proven by PROOF.bend, and the
      # committed packages/proven/generated/proven.mjs must match a rebuild.
      # Pinned release + sha256 from bend-lang.com/install.sh (v2.0.39).
      - name: Install Bend
        env:
          BEND_VERSION: 2.0.39
          BEND_SHA256: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
        run: |
          name="bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$name"
          echo "$BEND_SHA256  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          echo "BEND_BIN=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
        shell: bash
      - name: Bend proofs
        env:
          BEND_NO_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          BUN_ENABLE_CRASH_REPORTING: "0"
        run: pnpm proofs
      - run: pnpm validate-curated
      - run: pnpm validate-companies
      - name: Validate company tokens
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t CHANGED < <(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'data/companies/*.yaml' 'data/companies/*.yml' || true)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No company YAML changes."
            exit 0
          fi
          echo "Validating: ${CHANGED[*]}"
          pnpm validate-tokens "${CHANGED[@]}"
        shell: bash
