name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      # Standard library only: go.mod must never gain a dependency.
      - name: go.mod has no require
        run: |
          if grep -nE '^[[:space:]]*require([[:space:]]|\(|$)' go.mod; then
            echo "::error file=go.mod::go.mod must not require any module (standard library only)."
            exit 1
          fi
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # Ingest makes honest requests only (formerly scripts/check-honest-requests.mjs).
      # Also part of go test ./...; run by name so a failure is easy to spot.
      - name: Honest requests
        run: go test -count=1 -run 'TestHonestRequests$' ./internal/fetch
      - name: Build
        run: go build -o "$RUNNER_TEMP/openintern" ./cmd/openintern
      - run: '"$RUNNER_TEMP/openintern" validate-curated'
      - run: '"$RUNNER_TEMP/openintern" validate-companies'
      # Probes only boards a PR adds or edits (GITHUB_BASE_REF is set on
      # pull_request), through the honest client.
      - name: Validate company tokens
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t CHANGED < <(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'data/companies/*.yaml' 'data/companies/*.yml' || true)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No company YAML changes."
            exit 0
          fi
          echo "Validating: ${CHANGED[*]}"
          "$RUNNER_TEMP/openintern" validate-tokens "${CHANGED[@]}"
        shell: bash

  # Bend proof gate, isolated: no token permissions, no secrets, no caches,
  # no credentials left on disk. LAWS.bend must be proven by PROOF.bend, the
  # vectors the Go port is tested against must match the Bend model, and every
  # mutant in packages/proven/mutants.tsv (Bend and its Go equivalent) must be
  # caught.
  bend:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Pinned release; sha256 from bend-lang.com/install.sh (v2.0.39).
      - name: Install Bend
        env:
          BEND_VERSION: 2.0.39
          BEND_SHA256: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
        run: |
          name="bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$name"
          echo "$BEND_SHA256  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          echo "BEND_BIN=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
        shell: bash
      - name: Build
        run: go build -o "$RUNNER_TEMP/openintern" ./cmd/openintern
      # The gate also forces these off for every bend it runs.
      - name: Bend proofs
        env:
          BEND_NO_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          BUN_ENABLE_CRASH_REPORTING: "0"
        run: '"$RUNNER_TEMP/openintern" proofs check'
      - name: Mutants the laws and tests must catch
        env:
          BEND_NO_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          BUN_ENABLE_CRASH_REPORTING: "0"
        run: '"$RUNNER_TEMP/openintern" proofs mutants'
